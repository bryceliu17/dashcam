services:
  api:
    build:
      context: .
      dockerfile: server/Dashcam.Api/Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_URLS: http://+:5000
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DashcamDatabase: Data Source=/data/dashcam.db
      VideoStoragePath: /data/videos
      AudioStoragePath: /data/audio
      ImportStagingPath: /data/import-staging
      MaxStorageGB: ${DASHCAM_MAX_STORAGE_GB:-350}
      MaxAudioStorageGB: ${DASHCAM_MAX_AUDIO_STORAGE_GB:-20}
      TranscriptionWorkerUrl: http://transcription:8000
    volumes:
      - type: bind
        source: ${DASHCAM_DATA_PATH:-./data}
        target: /data
    depends_on:
      - transcription

  transcription:
    build:
      context: .
      dockerfile: transcription-worker/Dockerfile
    restart: unless-stopped
    gpus: all
    environment:
      AUDIO_ROOT: /data/audio
      WHISPER_MODEL: turbo
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
      WHISPER_MODEL_CACHE: /models
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      PYANNOTE_MODEL: ${PYANNOTE_MODEL:-pyannote/speaker-diarization-community-1}
      PYANNOTE_DEVICE: ${PYANNOTE_DEVICE:-cuda}
    volumes:
      - type: bind
        source: ${DASHCAM_DATA_PATH:-./data}
        target: /data
        read_only: true
      - transcription-models:/models

  web:
    build:
      context: .
      dockerfile: web-dashboard/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  transcription-models:

